<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Brisa</title>
  <script>
    // Aplica el tema antes del primer paint para evitar parpadeo (FOUC).
    (function () {
      var theme = "dark";
      try {
        theme = localStorage.getItem("brisa-theme");
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
      } catch (e) {
        theme = "dark";
      }
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/png" href="/icon.png" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><img src="/icon.png" alt="Brisa" onerror="this.remove()" /></div>
        <div>
          <h1 id="brand-title">Brisa</h1>
          <span id="brand-tagline" class="tagline">Gestor de ports nativos de PC</span>
        </div>
      </div>
      <div class="topbar-right">
        <span id="platform-chip" class="chip"></span>
        <span id="app-version" class="chip"></span>
        <button id="btn-self-update" class="btn sm update-app" hidden>⬆</button>
        <button id="btn-self-changelog" class="btn ghost sm" title="Novedades" hidden>📝</button>
        <button id="btn-settings" class="btn ghost sm settings-btn" title="Ajustes">⚙️</button>
        <button id="btn-refresh" class="btn ghost" title="⟳ Refrescar">⟳ Refrescar</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card"><div class="stat-value" id="stat-roms">0</div><div class="stat-label" id="stat-label-roms">ROMs</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-installed">0</div><div class="stat-label" id="stat-label-installed">Ports instalados</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-mods">0</div><div class="stat-label" id="stat-label-mods">Mods</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-updates">0</div><div class="stat-label" id="stat-label-updates">Actualizaciones</div></div>
    </div>

    <div class="tabs-row">
      <nav class="tabs" id="main-tabs" role="tablist">
        <button class="tab-btn active" data-tab="installed" role="tab" aria-selected="true">
          <span class="tab-label" id="tab-label-installed"></span>
          <span class="tab-count" id="tab-count-installed"></span>
        </button>
        <button class="tab-btn" data-tab="available" role="tab" aria-selected="false">
          <span class="tab-label" id="tab-label-available"></span>
          <span class="tab-count" id="tab-count-available"></span>
        </button>
        <button class="tab-btn" data-tab="roms" role="tab" aria-selected="false">
          <span class="tab-label" id="tab-label-roms"></span>
          <span class="tab-count" id="tab-count-roms"></span>
        </button>
        <button class="tab-btn" data-tab="help" role="tab" aria-selected="false">
          <span class="tab-label" id="tab-label-help"></span>
        </button>
      </nav>
      <div class="tabs-actions">
        <button id="btn-export-manifests" class="btn ghost sm" title="">⬆</button>
        <button id="btn-import-manifests" class="btn ghost sm" title="">⬇</button>
        <input id="manifest-file-input" type="file" accept=".json,application/json" hidden />
      </div>
    </div>

    <!-- Barra global de tareas sin port (p. ej. Actualizar todos): progreso + cancelar -->
    <div id="global-task" class="global-task" hidden>
      <div class="progress"><div class="bar" id="global-task-bar"></div></div>
      <span id="global-task-stage" class="progress-stage"></span>
      <button id="global-task-cancel" class="btn red sm cancel-btn"></button>
    </div>

    <main>
      <section class="section tab-pane active" data-tab="installed" role="tabpanel" aria-labelledby="tab-label-installed">
        <div class="section-head">
          <span id="ports-hint-installed" class="hint"></span>
          <div class="section-tools">
            <button id="btn-update-all" class="btn ghost sm" title="" disabled>⬆</button>
            <input id="ports-search-installed" class="search-input" type="search" placeholder="Buscar…" autocomplete="off" spellcheck="false" />
            <div class="view-toggle" id="ports-view-toggle-installed">
              <button class="view-btn active" data-view="cards" title="Vista tarjetas">▦</button>
              <button class="view-btn" data-view="list" title="Vista lista">☰</button>
            </div>
          </div>
        </div>
        <div id="ports-grid-installed" class="grid"><div class="loading">Cargando…</div></div>
      </section>

      <section class="section tab-pane" data-tab="available" role="tabpanel" aria-labelledby="tab-label-available">
        <div class="section-head">
          <span id="ports-hint-available" class="hint"></span>
          <div class="section-tools">
            <input id="ports-search-available" class="search-input" type="search" placeholder="Buscar…" autocomplete="off" spellcheck="false" />
            <div class="view-toggle" id="ports-view-toggle-available">
              <button class="view-btn active" data-view="cards" title="Vista tarjetas">▦</button>
              <button class="view-btn" data-view="list" title="Vista lista">☰</button>
            </div>
          </div>
        </div>
        <div id="ports-grid-available" class="grid"><div class="loading">Cargando…</div></div>
      </section>

      <section class="section tab-pane" data-tab="roms" role="tabpanel" aria-labelledby="tab-label-roms">
        <div class="section-head">
          <span id="roms-hint" class="hint"></span>
          <div class="section-tools">
            <button id="btn-add-roms" class="btn ghost sm" title="">＋</button>
            <button id="btn-open-folder" class="btn ghost sm" title="">🗀</button>
            <input id="rom-file-input" type="file" multiple hidden />
            <div class="view-toggle" id="roms-view-toggle">
              <button class="view-btn active" data-view="cards" title="Vista tarjetas">▦</button>
              <button class="view-btn" data-view="list" title="Vista lista">☰</button>
            </div>
          </div>
        </div>
        <div id="roms-list" class="roms-grid"><div class="loading">Cargando…</div></div>
      </section>

      <section class="section tab-pane" data-tab="help" role="tabpanel" aria-labelledby="tab-label-help">
        <div class="section-head">
          <h2 id="help-title"></h2>
        </div>
        <p id="help-intro" class="help-intro"></p>
        <div id="help-steps" class="help-grid"></div>
      </section>
    </main>

    <footer class="footer">
      <span id="footer-text">Hecho con ♥</span> · <span id="footer-legal">Los ROMs deben obtenerse legalmente</span> · <span id="cfg-roms-dir"></span>
    </footer>
  </div>

  <div id="mods-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3 id="mods-modal-title"></h3>
        <button id="mods-modal-close" class="modal-close" title="Cerrar">✕</button>
      </div>
      <div id="mods-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal modal-confirm">
      <div class="modal-head">
        <h3 id="confirm-modal-title"></h3>
        <button id="confirm-modal-close" class="modal-close" title="Cerrar">✕</button>
      </div>
      <div id="confirm-modal-message" class="modal-body"></div>
      <div class="modal-foot">
        <button id="confirm-modal-cancel" class="btn ghost sm"></button>
        <button id="confirm-modal-ok" class="btn red sm"></button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal modal-settings">
      <div class="modal-head">
        <h3 id="settings-modal-title"></h3>
        <button id="settings-modal-close" class="modal-close" title="Cerrar">✕</button>
      </div>
      <div id="settings-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="changelog-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal modal-changelog">
      <div class="modal-head">
        <h3 id="changelog-modal-title"></h3>
        <button id="changelog-modal-close" class="modal-close" title="Cerrar">✕</button>
      </div>
      <div id="changelog-modal-body" class="modal-body changelog-body"></div>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-box">
      <div class="drop-icon">📥</div>
      <div id="drop-title" class="drop-title">Suelta los ROMs aquí</div>
      <div id="drop-hint" class="drop-hint">Se copiarán a la carpeta de ROMs de Brisa</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/i18n.js"></script>
  <script src="/api.js"></script>
  <script src="/utils.js"></script>
  <script src="/app.js"></script>
</body>
</html>
