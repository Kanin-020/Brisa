<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brisa</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/png" href="/icon.png" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><img src="/icon.png" alt="Brisa" onerror="this.remove()" /></div>
        <div>
          <h1 id="brand-title">Brisa</h1>
          <span id="brand-tagline" class="tagline">Gestor de ports nativos de PC</span>
        </div>
      </div>
      <div class="topbar-right">
        <span id="platform-chip" class="chip"></span>
        <div class="locale-selector" id="locale-selector">
          <!-- Locale buttons rendered dynamically by app.js -->
        </div>
        <button id="btn-refresh" class="btn ghost" title="⟳ Refrescar">⟳ Refrescar</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card"><div class="stat-value" id="stat-roms">0</div><div class="stat-label" id="stat-label-roms">ROMs</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-installed">0</div><div class="stat-label" id="stat-label-installed">Ports instalados</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-mods">0</div><div class="stat-label" id="stat-label-mods">Mods</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-updates">0</div><div class="stat-label" id="stat-label-updates">Actualizaciones</div></div>
    </div>

    <main>
      <section class="section">
        <div class="section-head">
          <h2 id="ports-title">📦 Ports</h2>
          <span id="ports-hint" class="hint"></span>
          <div class="section-tools">
            <button id="btn-export-manifests" class="btn ghost sm" title="">⬆</button>
            <button id="btn-import-manifests" class="btn ghost sm" title="">⬇</button>
            <input id="manifest-file-input" type="file" accept=".json,application/json" hidden />
            <input id="ports-search" class="search-input" type="search" placeholder="Buscar…" autocomplete="off" spellcheck="false" />
            <div class="view-toggle" id="ports-view-toggle">
              <button class="view-btn active" data-view="cards" title="Vista tarjetas">▦</button>
              <button class="view-btn" data-view="list" title="Vista lista">☰</button>
            </div>
          </div>
        </div>
        <div id="ports-grid" class="grid"><div class="loading" id="loading-ports">Cargando…</div></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 id="roms-title">💾 ROMs detectados</h2>
          <span id="roms-hint" class="hint"></span>
          <div class="section-tools">
            <button id="btn-add-roms" class="btn ghost sm" title="">＋</button>
            <button id="btn-open-folder" class="btn ghost sm" title="">🗀</button>
            <input id="rom-file-input" type="file" multiple hidden />
          </div>
        </div>
        <div id="roms-list" class="roms-list"><div class="loading" id="loading-roms">Cargando…</div></div>
      </section>
    </main>

    <footer class="footer">
      <span id="footer-text">Hecho con ♥</span> · <span id="footer-legal">Los ROMs deben obtenerse legalmente</span> · <span id="cfg-roms-dir"></span>
    </footer>
  </div>

  <div id="mods-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3 id="mods-modal-title"></h3>
        <button id="mods-modal-close" class="modal-close" title="Cerrar">✕</button>
      </div>
      <div id="mods-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-box">
      <div class="drop-icon">📥</div>
      <div id="drop-title" class="drop-title">Suelta los ROMs aquí</div>
      <div id="drop-hint" class="drop-hint">Se copiarán a la carpeta de ROMs de Brisa</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
