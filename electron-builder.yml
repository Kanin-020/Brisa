appId: io.brisa.desktop
productName: Brisa
artifactName: Brisa-${os}-${arch}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: manifests
    to: manifests
  - from: release/gui/cli-entry.cjs
    to: cli-entry.cjs
  - from: src/web/icon.png
    to: icon.png
  - from: src/web/icon.icon
    to: icon.ico

linux:
  target:
    - AppImage
  icon: src/web/icon.png
  category: Utility
  maintainer: Brisa

win:
  target:
    - nsis
  icon: src/web/icon.ico