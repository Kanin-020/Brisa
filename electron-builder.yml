appId: io.brisa.desktop
productName: Brisa
artifactName: Brisa-${os}-${arch}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: manifests
    to: manifests
  - from: release/gui/cli-entry.cjs
    to: cli-entry.cjs
  - from: src/web/icon.png
    to: icon.png
  - from: src/web/icon.ico
    to: icon.ico

linux:
  target:
    - AppImage
    - flatpak
  icon: src/web/icon.png
  category: Utility
  maintainer: Brisa

flatpak:
  runtime: org.freedesktop.Platform
  sdk: org.freedesktop.Sdk
  runtimeVersion: "24.08"
  branch: stable
  finishArgs:
    - "--socket=wayland"
    - "--socket=x11"
    - "--share=ipc"
    - "--device=dri"
    - "--socket=pulseaudio"
    - "--filesystem=home"
    - "--share=network"
    - "--talk-name=org.freedesktop.Notifications"
    - "--talk-name=org.kde.StatusNotifierWatcher"
    - "--talk-name=com.canonical.AppMenu.Registrar"

win:
  target:
    - nsis
  icon: src/web/icon.ico