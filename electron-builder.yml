appId: io.brisa.desktop
productName: Brisa
artifactName: Brisa-${arch}.${ext}

directories:
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: manifests
    to: manifests
  - from: release/gui/cli-entry.cjs
    to: cli-entry.cjs

linux:
  target:
    - AppImage
  icon: src/web/icon.png
  category: Utility
  maintainer: Brisa

win:
  target:
    - zip
  icon: src/web/icon.png